name: Release Windows Exe

on:
  push:
    tags:
      - 'v1*' # Triggers on tags like v1.0.0
  workflow_dispatch: # Adds a manual "Run workflow" button on GitHub

jobs:
  release:
    name: Build and Upload Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Executable
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o brigaider.exe brigaider.go

      - name: Publish Release with Asset
        uses: softprops/action-gh-release@v2
        with:
          files: brigaider.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
