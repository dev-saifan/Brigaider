name: Release Windows Exe From Linux

on:
  push:
    tags:
      - 'v1*'
  workflow_dispatch:

jobs:
  release:
    name: Build and Upload Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Executable
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o brigaider.exe brigaider.go

      - name: Determine Tag Name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v1.0.0-manual-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release with Asset
        uses: softprops/action-gh-release@v2
        with:
          files: brigaider.exe
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
